[package]
name = "spacelyzer-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast disk-usage scanner, treemap layout and hit-testing engine for Spacelyzer"

[lib]
name = "spacelyzer_engine"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "spz"
path = "src/bin/spz.rs"

[dependencies]
arc-swap = "1"
libc = "0.2"
rayon = "1.10"

[features]
# Test-only panic injection into the size-table writer. Never enabled in release builds.
failpoints = []
