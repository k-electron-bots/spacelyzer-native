name: m3-first-run
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compile-only: build and compile checks only, no app launch or measurement. full: the single approved measurement run."
        required: true
        default: "compile-only"
        type: choice
        options:
          - compile-only
          - full

# Single capped first measurement run for milestone M3-B
# (docs/m3-measurement-protocol.md). Manual dispatch only: one approved run,
# no retry without fresh approval. Every number this run produces is
# BASELINE ONLY: event-to-AX-visible latency, not proof of main-thread block,
# and not a calibrated result.

permissions:
  contents: read

jobs:
  m3-first-run:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Single-attempt guard
        id: guard
        run: |
          # The approval covers exactly one run. A re-run of the same workflow
          # run would be a second run; refuse it.
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "BLOCKED: run_attempt=${{ github.run_attempt }} is not 1; re-runs need fresh approval"
            exit 1
          fi

      - name: Preflight context record
        id: preflight
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/m3-artifacts"
          mkdir -p "$ART"
          date +%s > "$RUNNER_TEMP/m3-t0"
          {
            date -u
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            echo "repo_sha=${{ github.sha }} run_id=${{ github.run_id }} run_attempt=${{ github.run_attempt }}"
            echo "mode=${{ inputs.mode }}"
            shasum -a 256 scripts/m3-interaction-bench.swift scripts/m3-readiness.swift scripts/ax-client.swift scripts/make_fixtures.py docs/m3-measurement-protocol.md
          } 2>&1 | tee "$ART/preflight.txt"

      - name: Rust toolchain and universal engine
        id: toolchain
        run: |
          rustup update stable --no-self-update
          ./scripts/build-engine.sh

      - name: Import self-signed identity
        id: sign
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          HASH="$(./scripts/sign-setup.sh | tail -1)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Build signed app bundle
        id: build
        run: ./scripts/package-dmg.sh "0.1.${{ github.run_number }}-m3" "${{ steps.sign.outputs.hash }}"

      - name: Fixtures generate and verify (typing-200k, expansion-10k)
        id: fixtures
        run: |
          set -o pipefail
          ART="$RUNNER_TEMP/m3-artifacts"
          python3 scripts/make_fixtures.py generate "$RUNNER_TEMP/m3fix-typing" --profile typing-200k 2>&1 | tee "$ART/fixtures-typing.txt"
          python3 scripts/make_fixtures.py verify "$RUNNER_TEMP/m3fix-typing" --profile typing-200k 2>&1 | tee -a "$ART/fixtures-typing.txt"
          python3 scripts/make_fixtures.py generate "$RUNNER_TEMP/m3fix-exp" --profile expansion-10k 2>&1 | tee "$ART/fixtures-expansion.txt"
          python3 scripts/make_fixtures.py verify "$RUNNER_TEMP/m3fix-exp" --profile expansion-10k 2>&1 | tee -a "$ART/fixtures-expansion.txt"

      - name: Footer accessibility proof (recorded finding)
        id: footer
        if: ${{ !cancelled() && github.run_attempt == 1 && inputs.mode == 'full' }}
        run: |
          set -uo pipefail
          set +e
          ART="$RUNNER_TEMP/m3-artifacts"
          APP="$GITHUB_WORKSPACE/dist/Spacelyzer.app"
          PID=""
          # Bounded terminate+wait of the owned app instance; used on every exit path.
          cleanup_app() {
            [ -n "$PID" ] || return 0
            kill "$PID" 2>/dev/null
            for i in $(seq 1 10); do kill -0 "$PID" 2>/dev/null || { echo "app instance $PID terminated"; return 0; }; sleep 1; done
            kill -9 "$PID" 2>/dev/null
            for i in $(seq 1 5); do kill -0 "$PID" 2>/dev/null || { echo "app instance $PID terminated (sigkill)"; return 0; }; sleep 1; done
            echo "WARNING: app instance $PID still running after bounded terminate"
          }
          if pgrep -x Spacelyzer >/dev/null; then echo "PRECHECK FAILED: Spacelyzer already running"; echo "FOOTER VERDICT: FAIL (precheck) - recorded finding, measurements still run" | tee "$ART/footer-verdict.txt"; echo "footer_verdict=FAIL" >> "$GITHUB_OUTPUT"; exit 0; fi
          rm -f /tmp/spz-footer-* /tmp/spz-demo-ready-* /tmp/spz-demo-ack-* /tmp/spz-demo-step /tmp/spz-cold-click-* /tmp/spz-assertions.txt /tmp/spz-timing.txt /tmp/spz-geom.txt
          open -n "$APP" --env SPZ_AUTOSCAN="$RUNNER_TEMP/m3fix-exp/expansion-10000" --env SPZ_DEMO=1
          for i in $(seq 1 30); do
            n=$(pgrep -x Spacelyzer | wc -l | tr -d ' ')
            if [ "$n" = "1" ]; then PID=$(pgrep -x Spacelyzer); break; fi
            sleep 1
          done
          if [ -z "$PID" ]; then
            echo "APP DID NOT LAUNCH UNIQUELY"
            # The precheck proved no Spacelyzer instance existed before our open, so
            # anything running now belongs to this launch. Bounded terminate+wait.
            for p in $(pgrep -x Spacelyzer); do kill "$p" 2>/dev/null; done
            for i in $(seq 1 10); do pgrep -x Spacelyzer >/dev/null || break; sleep 1; done
            if pgrep -x Spacelyzer >/dev/null; then
              pgrep -x Spacelyzer | xargs kill -9 2>/dev/null
              for i in $(seq 1 5); do pgrep -x Spacelyzer >/dev/null || break; sleep 1; done
            fi
            if pgrep -x Spacelyzer >/dev/null; then echo "WARNING: Spacelyzer still running after bounded terminate"; else echo "launched instance(s) terminated"; fi
            echo "FOOTER VERDICT: FAIL (launch) - recorded finding, measurements still run" | tee "$ART/footer-verdict.txt"
            echo "footer_verdict=FAIL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          trap cleanup_app EXIT
          ps -p "$PID" -o pid=,comm= | tee "$ART/footer-app-pid.txt"
          # Acknowledge every demo capture mark so the scripted flow reaches the
          # footer window inside the 35-minute cap. Every ack means capture
          # SKIPPED: no screenshots are recorded and no pixel claim is made;
          # M3 consumes nothing from this segment's in-app captures.
          ( while :; do
              for r in /tmp/spz-demo-ready-*; do
                [ -e "$r" ] || continue
                a="${r/ready/ack}"
                [ -e "$a" ] || : > "$a"
              done
              [ -f /tmp/spz-cold-click-ready ] && [ ! -f /tmp/spz-cold-click-ack ] && : > /tmp/spz-cold-click-ack
              [ -f /tmp/spz-footer-ax-ready ] && break
              sleep 0.5
            done ) &
          ACKLOOP=$!
          ok=""
          for i in $(seq 1 480); do [ -f /tmp/spz-footer-ax-ready ] && { ok=1; break; }; sleep 1; done
          kill "$ACKLOOP" 2>/dev/null
          if [ -z "$ok" ]; then echo "FOOTER WINDOW NEVER READY"; echo "FOOTER VERDICT: FAIL (window never ready) - recorded finding, measurements still run" | tee "$ART/footer-verdict.txt"; echo "footer_verdict=FAIL" >> "$GITHUB_OUTPUT"; exit 0; fi
          swift scripts/ax-client.swift "$PID" /tmp/spz-footer-ax-expected.txt /tmp/spz-footer-ax-result.txt 2>&1 | tee "$ART/footer-ax-client.log"
          code=${PIPESTATUS[0]}
          printf 'EXIT_%s' "$code" > /tmp/spz-footer-ax-status.txt  # no trailing newline: the app compares clientStatus == "EXIT_0" exactly
          : > /tmp/spz-footer-ax-ack
          # Wait for the complete footer-native assertion AND the walker-entries
          # completion marker (written after the entries dump), not a fixed sleep.
          line=""
          for i in $(seq 1 90); do
            [ -f /tmp/spz-footer-ax-entries-done ] && grep -q 'footer-native-accessibility-full-details' /tmp/spz-assertions.txt 2>/dev/null && { line=1; break; }
            sleep 0.5
          done
          [ -n "$line" ] || echo "FOOTER EVIDENCE: INCONCLUSIVE - footer-native assertion or walker-entries marker missing (entries dump may have failed)"
          # Evidence copies must never fail silently: a swallowed cp leaves the
          # artifact MISSING/EMPTY while the verdict says VERIFIED, which reads as
          # inconclusive evidence. Copy each file loudly so the step log names the
          # exact failure (run 37814251307: all three footer-ax-* artifact copies
          # were MISSING/EMPTY with the error hidden by 2>/dev/null).
          for pair in "/tmp/spz-footer-ax-expected.txt:$ART/footer-ax-expected.txt" "/tmp/spz-footer-ax-result.txt:$ART/footer-ax-result.txt" "/tmp/spz-footer-ax-status.txt:$ART/footer-ax-status.txt" "/tmp/spz-assertions.txt:$ART/footer-assertions.txt" "/tmp/spz-timing.txt:$ART/footer-demo-timing.txt" "/tmp/spz-geom.txt:$ART/footer-demo-geom.txt"; do
            src="${pair%%:*}"; dst="${pair##*:}"
            if cp "$src" "$dst" 2>&1; then
              echo "artifact copy OK: $src -> $dst"
            else
              echo "ARTIFACT COPY FAILED: $src -> $dst (source exists: $([ -e "$src" ] && echo yes || echo no), size: $(stat -f%z "$src" 2>/dev/null || echo n/a), dest dir exists: $([ -d "$ART" ] && echo yes || echo no))"
            fi
          done
          RESULT=$(cat /tmp/spz-footer-ax-result.txt 2>/dev/null || echo MISSING)
          {
            echo "ax_client_exit=$code"
            echo "footer_ax_result=$RESULT"
            echo "app_assertions_line_seen=${line:-0}"
          } | tee "$ART/footer-verdict.txt"
          if cp /tmp/spz-footer-ax-entries.txt "$ART/footer-ax-entries.txt" 2>&1; then
            echo "artifact copy OK: /tmp/spz-footer-ax-entries.txt -> $ART/footer-ax-entries.txt"
          else
            echo "ARTIFACT COPY FAILED: /tmp/spz-footer-ax-entries.txt (exists: $([ -e /tmp/spz-footer-ax-entries.txt ] && echo yes || echo no), size: $(stat -f%z /tmp/spz-footer-ax-entries.txt 2>/dev/null || echo n/a))"
          fi
          # Observability: everything the gate knows is printed into the step LOG.
          # The artifact is a copy, never the only record.
          for f in "$ART/footer-verdict.txt" "$ART/footer-assertions.txt" "$ART/footer-ax-entries.txt" "$ART/footer-ax-expected.txt" "$ART/footer-ax-result.txt" "$ART/footer-ax-status.txt"; do
            if [ -s "$f" ]; then echo "===== $f ====="; cat "$f"; else echo "===== $f MISSING/EMPTY - evidence INCONCLUSIVE ====="; fi
          done
          fail=""
          [ "$code" = "0" ] || { echo "GATE FAIL: ax-client exit $code (not 0)"; fail=1; }
          [ "$RESULT" = "VERIFIED" ] || { echo "GATE FAIL: result file is '$RESULT' (not VERIFIED)"; fail=1; }
          [ -n "$line" ] || { echo "GATE FAIL: footer-native assertion or walker-entries marker never appeared"; fail=1; }
          grep -q '^PASS footer-external-same-node-help-value-exact-details' /tmp/spz-assertions.txt 2>/dev/null || { echo "GATE FAIL: no PASS footer-external-same-node-help-value-exact-details"; fail=1; }
          grep -q '^PASS footer-native-accessibility-full-details' /tmp/spz-assertions.txt 2>/dev/null || { echo "GATE FAIL: no PASS footer-native-accessibility-full-details"; fail=1; }
          grep -q '^FAIL footer-' /tmp/spz-assertions.txt 2>/dev/null && { echo "GATE FAIL: a FAIL footer- assertion is present"; fail=1; }
          if [ -n "$fail" ]; then
            echo "FOOTER VERDICT: FAIL (recorded finding - measurement segments still run)" | tee -a "$ART/footer-verdict.txt"
            echo "footer_verdict=FAIL" >> "$GITHUB_OUTPUT"
          else
            echo "FOOTER GATE: VERIFIED" | tee -a "$ART/footer-verdict.txt"
            echo "footer_verdict=PASS" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile M3-B interaction bench and readiness probe
        id: compile
        if: ${{ !cancelled() && github.run_attempt == 1 && steps.guard.outcome == 'success' && steps.preflight.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.sign.outcome == 'success' && steps.build.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/m3-artifacts"
          rm -f "$RUNNER_TEMP/m3bench" "$RUNNER_TEMP/m3-readiness"
          swiftc -O -o "$RUNNER_TEMP/m3bench" scripts/m3-interaction-bench.swift 2>&1 | tee "$ART/bench-compile.txt"
          swiftc -O -o "$RUNNER_TEMP/m3-readiness" scripts/m3-readiness.swift 2>&1 | tee -a "$ART/bench-compile.txt"
          shasum -a 256 "$RUNNER_TEMP/m3bench" "$RUNNER_TEMP/m3-readiness" | tee -a "$ART/bench-compile.txt"

      - name: Expansion measurement (expansion-10k, 5 reps)
        if: ${{ inputs.mode == 'full' && !cancelled() && github.run_attempt == 1 && steps.build.outcome == 'success' && steps.fixtures.outcome == 'success' && steps.compile.outcome == 'success' }}
        run: |
          set -uo pipefail
          set +e
          ART="$RUNNER_TEMP/m3-artifacts"
          [ -f "$ART/m3-BLOCKER.txt" ] && { echo "SKIPPED: blocker recorded earlier"; exit 10; }
          [ -x "$RUNNER_TEMP/m3bench" ] || { echo "SKIPPED: bench binary missing (earlier step failed)"; exit 10; }
          pgrep -x Spacelyzer >/dev/null && { echo "PRECHECK FAILED: Spacelyzer already running"; exit 10; }
          open -n "$GITHUB_WORKSPACE/dist/Spacelyzer.app" --env SPZ_AUTOSCAN="$RUNNER_TEMP/m3fix-exp/expansion-10000"
          PID=""
          for i in $(seq 1 30); do
            n=$(pgrep -x Spacelyzer | wc -l | tr -d ' ')
            if [ "$n" = "1" ]; then PID=$(pgrep -x Spacelyzer); break; fi
            sleep 1
          done
          [ -n "$PID" ] || { echo "APP DID NOT LAUNCH UNIQUELY"; exit 10; }
          trap 'kill "$PID" 2>/dev/null' EXIT
          ps -p "$PID" -o pid=,comm= | tee "$ART/m3-expansion-pid.txt"
          "$RUNNER_TEMP/m3-readiness" "$PID" 90 "$RUNNER_TEMP/m3fix-exp/expansion-10000" 2>&1 | tee "$ART/m3-expansion-readiness.txt"
          rs=${PIPESTATUS[0]}
          if [ "$rs" = "3" ]; then echo "BLOCKER: AX trust unavailable (readiness probe)" | tee "$ART/m3-BLOCKER.txt"; exit 10; fi
          if [ "$rs" != "0" ]; then echo "READINESS NOT ESTABLISHED - expansion segment findings-only"; exit 10; fi
          "$RUNNER_TEMP/m3bench" expansion "$PID" "$ART/m3-expansion-10k.jsonl" expansion-10000 5 2>&1 | tee "$ART/m3-expansion-10k.log"
          bs=${PIPESTATUS[0]}
          echo "expansion_exit=$bs" | tee "$ART/m3-expansion-exit.txt"
          if [ "$bs" = "3" ]; then echo "BLOCKER: AX trust unavailable (bench)" | tee "$ART/m3-BLOCKER.txt"; exit 10; fi
          exit 0

      - name: Typing (200 keys, typing-200k) then hover (60 sweeps)
        if: ${{ inputs.mode == 'full' && !cancelled() && github.run_attempt == 1 && steps.build.outcome == 'success' && steps.fixtures.outcome == 'success' && steps.compile.outcome == 'success' }}
        run: |
          set -uo pipefail
          set +e
          ART="$RUNNER_TEMP/m3-artifacts"
          [ -f "$ART/m3-BLOCKER.txt" ] && { echo "SKIPPED: blocker recorded earlier"; exit 10; }
          [ -x "$RUNNER_TEMP/m3bench" ] || { echo "SKIPPED: bench binary missing (earlier step failed)"; exit 10; }
          pgrep -x Spacelyzer >/dev/null && { echo "PRECHECK FAILED: Spacelyzer already running"; exit 10; }
          open -n "$GITHUB_WORKSPACE/dist/Spacelyzer.app" --env SPZ_AUTOSCAN="$RUNNER_TEMP/m3fix-typing/typing-200k"
          PID=""
          for i in $(seq 1 30); do
            n=$(pgrep -x Spacelyzer | wc -l | tr -d ' ')
            if [ "$n" = "1" ]; then PID=$(pgrep -x Spacelyzer); break; fi
            sleep 1
          done
          [ -n "$PID" ] || { echo "APP DID NOT LAUNCH UNIQUELY"; exit 10; }
          trap 'kill "$PID" 2>/dev/null' EXIT
          ps -p "$PID" -o pid=,comm= | tee "$ART/m3-typing-pid.txt"
          "$RUNNER_TEMP/m3-readiness" "$PID" 180 "$RUNNER_TEMP/m3fix-typing/typing-200k" 2>&1 | tee "$ART/m3-typing-readiness.txt"
          rs=${PIPESTATUS[0]}
          if [ "$rs" = "3" ]; then echo "BLOCKER: AX trust unavailable (readiness probe)" | tee "$ART/m3-BLOCKER.txt"; exit 10; fi
          if [ "$rs" != "0" ]; then echo "READINESS NOT ESTABLISHED - typing/hover segment findings-only"; exit 10; fi
          "$RUNNER_TEMP/m3bench" typing "$PID" "$ART/m3-typing-200k.jsonl" 200 2>&1 | tee "$ART/m3-typing-200k.log"
          ts=${PIPESTATUS[0]}
          echo "typing_exit=$ts" | tee "$ART/m3-typing-exit.txt"
          if [ "$ts" = "3" ]; then echo "BLOCKER: AX trust unavailable (bench typing)" | tee "$ART/m3-BLOCKER.txt"; exit 10; fi
          "$RUNNER_TEMP/m3bench" hover "$PID" "$ART/m3-hover.jsonl" 60 2>&1 | tee "$ART/m3-hover.log"
          hs=${PIPESTATUS[0]}
          echo "hover_exit=$hs" | tee "$ART/m3-hover-exit.txt"
          if [ "$hs" = "3" ]; then echo "BLOCKER: AX trust unavailable (bench hover)" | tee "$ART/m3-BLOCKER.txt"; exit 10; fi
          exit 0

      - name: Optional expansion-100k (only if 12+ minutes remain)
        if: ${{ inputs.mode == 'full' && !cancelled() && github.run_attempt == 1 && steps.build.outcome == 'success' && steps.fixtures.outcome == 'success' && steps.compile.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          set -uo pipefail
          set +e
          ART="$RUNNER_TEMP/m3-artifacts"
          elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/m3-t0") ))
          remain=$(( 35*60 - elapsed ))
          echo "elapsed=${elapsed}s remain=${remain}s" | tee "$ART/expansion-100k-decision.txt"
          [ -f "$ART/m3-BLOCKER.txt" ] && { echo "SKIPPED: blocker recorded" | tee -a "$ART/expansion-100k-decision.txt"; exit 0; }
          if [ "$remain" -lt 720 ]; then echo "SKIPPED: under 12 minutes remain" | tee -a "$ART/expansion-100k-decision.txt"; exit 0; fi
          [ -x "$RUNNER_TEMP/m3bench" ] || { echo "SKIPPED: bench binary missing" | tee -a "$ART/expansion-100k-decision.txt"; exit 0; }
          python3 scripts/make_fixtures.py generate "$RUNNER_TEMP/m3fix-exp100" --profile expansion-100k 2>&1 | tee "$ART/fixtures-expansion-100k.txt"
          gs=${PIPESTATUS[0]}
          python3 scripts/make_fixtures.py verify "$RUNNER_TEMP/m3fix-exp100" --profile expansion-100k 2>&1 | tee -a "$ART/fixtures-expansion-100k.txt"
          vs=${PIPESTATUS[0]}
          if [ "$gs" != "0" ] || [ "$vs" != "0" ]; then echo "FIXTURE GENERATE/VERIFY FAILED (generate=$gs verify=$vs) - optional segment findings-only" | tee -a "$ART/expansion-100k-decision.txt"; exit 0; fi
          pgrep -x Spacelyzer >/dev/null && { echo "PRECHECK FAILED: Spacelyzer already running"; exit 10; }
          open -n "$GITHUB_WORKSPACE/dist/Spacelyzer.app" --env SPZ_AUTOSCAN="$RUNNER_TEMP/m3fix-exp100/expansion-100000"
          PID=""
          for i in $(seq 1 30); do
            n=$(pgrep -x Spacelyzer | wc -l | tr -d ' ')
            if [ "$n" = "1" ]; then PID=$(pgrep -x Spacelyzer); break; fi
            sleep 1
          done
          [ -n "$PID" ] || { echo "APP DID NOT LAUNCH UNIQUELY"; exit 0; }
          trap 'kill "$PID" 2>/dev/null' EXIT
          "$RUNNER_TEMP/m3-readiness" "$PID" 120 "$RUNNER_TEMP/m3fix-exp100/expansion-100000" 2>&1 | tee "$ART/m3-expansion-100k-readiness.txt"
          rs=${PIPESTATUS[0]}
          if [ "$rs" != "0" ]; then echo "READINESS NOT ESTABLISHED (probe exit $rs) - segment findings-only"; [ "$rs" = "3" ] && echo "BLOCKER: AX trust unavailable (readiness probe)" | tee "$ART/m3-BLOCKER.txt"; exit 0; fi
          "$RUNNER_TEMP/m3bench" expansion "$PID" "$ART/m3-expansion-100k.jsonl" expansion-100000 3 2>&1 | tee "$ART/m3-expansion-100k.log"
          bs=${PIPESTATUS[0]}
          echo "expansion100k_exit=$bs" | tee "$ART/m3-expansion-100k-exit.txt"
          [ "$bs" = "3" ] && echo "BLOCKER: AX trust unavailable (bench)" | tee "$ART/m3-BLOCKER.txt"
          exit 0

      - name: Footer verdict (recorded finding)
        if: always()
        run: |
          ART="$RUNNER_TEMP/m3-artifacts"
          echo "Footer gate outcome (finding only; measurement segments are unaffected):"
          cat "$ART/footer-verdict.txt" 2>/dev/null || echo "footer-verdict.txt missing (footer step did not complete)"
          echo "footer_verdict=${{ steps.footer.outputs.footer_verdict }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-first-run-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-artifacts
