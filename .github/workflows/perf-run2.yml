name: Combined perf run 2

# Engineering option, NOT approval to run and NOT a CI cadence. Dispatch-only, no inputs, no schedule, no push/PR/tag trigger.
# Must stay disabled until the owner approves a specific run; one attempt, no retry, no release, no tag, no upload to GitHub releases, no notarization.
# Purpose: ONE Mac run, priority-ordered, each leg isolated (own continue-on-error step, own verdict file, honest NOT-RUN/INCOMPLETE/INCONCLUSIVE, never faked):
#   1. accuracy 1k/10k/100k (default + portable engine legs, tamper controls first) - scripts/perf2-accuracy.py
#   2. stability/responsiveness - scripts/perf2-stability.sh: expansion-10k x5, typing 200 keys on 200k, hover 60 sweeps, same-session liveness, engine rescan memory
#      plateau (60 scans, median windows 15/15, 5%, engine process only), crash-report check, app RSS series (informational)
#   3. cancel latency n=3 through the in-app PerfDriver (no accessibility) at 20k items of a 200k tree - scripts/perf2-cancel.sh
# No 1M fixture, no 1M timing. Latency numbers are BASELINE evidence; no latency threshold is gated (none owner-approved).
# Time: 2100 s job clock anchored before checkout; every leg is admitted only if work seconds + a 410 s reserve (upload 120, teardown 200, margin 90) remain.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-guard:
    # Fail-closed author/committer identity check for commits this event introduces.
    # NEW is bounded by pinned trusted baselines audited clean on 2026-10-27 (full ancestry, after the identity rewrite; see
    # BASELINES in the script), never by other refs - a bad commit reachable from a
    # surviving branch/tag cannot be laundered out of the set. ci.yml is currently
    # disabled: this is a check that runs when CI runs (epic-* tag push,
    # pull_request, workflow_dispatch), NOT server-side push prevention. Direct
    # branch pushes do not trigger ci.yml; their coverage is the external drift
    # watch. engine-linux and macos `needs: identity-guard`: a guard failure
    # skips the build/release jobs. ~1 minute of ubuntu time, no Mac runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identity guard (fail-closed)
        env:
          IG_EVENT: ${{ github.event_name }}
          IG_REF_TYPE: ${{ github.ref_type }}
          IG_BASE: ${{ github.event.pull_request.base.sha }}
          IG_HEAD: ${{ github.event.pull_request.head.sha }}
          IG_BEFORE: ${{ github.event.before }}
          IG_SHA: ${{ github.sha }}
        run: |
          # identity-guard: FAIL CLOSED if any NEW commit introduced by this event carries an
          # author or committer email outside the approved set (blank/missing email included).
          #
          # NEW is defined against PINNED TRUSTED BASELINES - commits audited clean on
          # 2026-10-27 (author+committer, full ancestry, after the identity rewrite). A commit counts as new only when it
          # is in NO baseline ancestry. Bounding by "other refs" was rejected in review: a
          # bad commit reachable from any surviving branch/tag would be laundered out of the
          # set. Baseline ancestry itself is never scanned: it is the audited-clean past.
          # Legacy pre-rewrite refs (old release tags etc.) do not descend from these
          # baselines, so dispatching or re-tagging them fails closed over the cap - clearly,
          # never silently green. Re-baselining is a deliberate audited edit of this file.
          #
          # COVERAGE HONESTY: ci.yml is currently DISABLED. When it runs (epic-* tag push,
          # pull_request, workflow_dispatch) this guard is a check that runs when CI runs -
          # NOT server-side push prevention. Direct branch pushes do not trigger ci.yml;
          # their identity coverage is the external drift watch. Gating: engine-linux and
          # macos `needs: identity-guard`, so a guard failure skips the build/release jobs.
          #
          # Env (mapped from GitHub context by the workflow step; values only, never inline):
          #   IG_EVENT    = pull_request | push | workflow_dispatch (else fail closed)
          #   IG_REF_TYPE = branch | tag  (push only)
          #   IG_BASE/IG_HEAD = PR base/head sha (pull_request)
          #   IG_BEFORE   = push before sha (push; all-zeros on new branch)
          #   IG_SHA      = event head sha (all events)
          #   IG_MAX_NEW  = cap on the bounded new-commit set (default 500; over-cap fails closed)
          set -euo pipefail
          # Approved identities, grounded in measured current history (%ae/%ce counts on
          # 2026-10-27, whole history after the rewrite): k-electron-ai noreply (582), k.electron.ai@gmail.com (775),
          # GitHub web-merge committer noreply@github.com (561). Historical use is not
          # ownership, so no other identity is allowed for FUTURE commits.
          ALLOW='^(k-electron-ai@users\.noreply\.github\.com|k\.electron\.ai@gmail\.com|noreply@github\.com)$'
          ZERO=0000000000000000000000000000000000000000
          MAX_NEW="${IG_MAX_NEW:-500}"
          # Trusted baselines, audited clean (author+committer, full ancestry) 2026-10-27, after the identity rewrite; the earlier 2026-10-22 baselines were NOT clean (their ancestry carried unapproved identities).
          BASELINES=(
            9dddf523440815f010e61c2be0005e64e33ee255   # main
            da1b255f055564ca0524c90afc6a99da23329b3e   # mac-readiness-00aa46a2
            29453a13a3f37221242eb10815a6a0368d4f9aaf   # mac-stall-soak-00aa46a2
          )

          fail() { echo "::error::identity-guard FAIL-CLOSED: $1"; exit 1; }

          # Complete ref fetch pulls in the baseline objects even when the checked-out ref
          # (e.g. a tag) does not descend from them. Any failure fails closed - no || true.
          fetch_refs() {
            git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --quiet \
              || fail "ref fetch failed - cannot pull the trusted baselines; refusing to guess"
            local b
            for b in "${BASELINES[@]}"; do
              git cat-file -e "$b^{commit}" 2>/dev/null \
                || fail "trusted baseline $b missing locally after full fetch - cannot bound new commits against audited-clean history"
            done
          }

          check_commit_set() { # $1 = label; rest = rev-list args
            local label="$1"; shift
            local n emails_file bad_count
            n=$(git rev-list --count "$@" 2>/dev/null) \
              || fail "cannot enumerate new commits for $label (missing objects or malformed refs - insufficient history to prove new commits clean)"
            if [ "$n" -eq 0 ]; then echo "identity-guard: PASS (no new commits since the trusted baselines: $label)"; return 0; fi
            if [ "$n" -gt "$MAX_NEW" ]; then
              fail "new-commit set for $label is $n, over cap $MAX_NEW - this looks like legacy pre-baseline history or an unaudited long-lived ref; refusing to scan it as new. Remedy: gate via pull_request, or an audited re-baseline (deliberate guard edit)."
            fi
            emails_file=$(mktemp)
            git log --format='%ae%n%ce' "$@" > "$emails_file" \
              || { rm -f "$emails_file"; fail "cannot read new-commit identities for $label"; }
            # grep -c counts non-matching lines INCLUDING blank ones, so a blank author or
            # committer email can never strip away into a silent pass.
            bad_count=$(grep -cvxE "$ALLOW" "$emails_file" || true)
            if [ "$bad_count" != "0" ]; then
              echo "::error::identity-guard FAIL: $n new commit(s) ($label) carry unapproved or blank author/committer emails:"
              grep -vxE "$ALLOW" "$emails_file" | sort -u | sed 's/^$/(blank email)/'
              rm -f "$emails_file"
              exit 1
            fi
            rm -f "$emails_file"
            echo "identity-guard: PASS ($n new commit(s): $label)"
          }

          # Bounded new-commit set for events with no usable range (tag push, new-branch
          # push, force push, dispatch): commits reachable from $2 but from NO trusted
          # baseline ancestry. Sound against laundering: other branches/tags containing a
          # bad commit do not hide it, because only baseline ancestry is subtracted.
          baseline_check() { # $1 = label, $2 = sha
            git cat-file -e "$2^{commit}" 2>/dev/null \
              || fail "head $2 not present locally (shallow checkout? fetch-depth must be 0)"
            check_commit_set "$1 ($2 since trusted baselines)" "$2" --not "${BASELINES[@]}"
          }

          event="${IG_EVENT:-}"
          [ -n "$event" ] || fail "IG_EVENT unset - no event context, cannot determine the new-commit set"

          case "$event" in
            pull_request)
              [ -n "${IG_BASE:-}" ] && [ -n "${IG_HEAD:-}" ] || fail "pull_request without base/head sha"
              fetch_refs
              git cat-file -e "$IG_BASE^{commit}" 2>/dev/null || fail "base $IG_BASE not present locally (shallow checkout? fetch-depth must be 0)"
              git cat-file -e "$IG_HEAD^{commit}" 2>/dev/null || fail "head $IG_HEAD not present locally"
              check_commit_set "PR $IG_BASE..$IG_HEAD" "$IG_BASE..$IG_HEAD"
              ;;
            push)
              [ -n "${IG_SHA:-}" ] || fail "push without head sha"
              fetch_refs
              if [ "${IG_REF_TYPE:-}" = "tag" ]; then
                echo "identity-guard: NOTE a tag push carries no commit range; checking commits the tag introduces since the trusted baselines (cap $MAX_NEW). Range enforcement applies to pull_request events; direct branch pushes are covered by the external drift watch."
                baseline_check "tag push" "$IG_SHA"
                exit 0
              fi
              git cat-file -e "$IG_SHA^{commit}" 2>/dev/null || fail "head $IG_SHA not present locally"
              if [ "${IG_BEFORE:-}" = "$ZERO" ] || [ -z "${IG_BEFORE:-}" ]; then
                MODE=baseline   # new branch: no before
              elif git merge-base --is-ancestor "$IG_BEFORE" "$IG_SHA" 2>/dev/null; then
                MODE=range      # normal push: before..after is exactly the pushed set
              else
                MODE=baseline   # force push: before is not an ancestor, range would be meaningless
              fi
              if [ "$MODE" = range ]; then
                check_commit_set "push $IG_BEFORE..$IG_SHA" "$IG_BEFORE..$IG_SHA"
              else
                baseline_check "push" "$IG_SHA"
              fi
              ;;
            workflow_dispatch)
              [ -n "${IG_SHA:-}" ] || fail "workflow_dispatch without sha"
              fetch_refs
              echo "identity-guard: NOTE dispatch carries no commit range; checking commits the dispatched ref introduces since the trusted baselines (cap $MAX_NEW). Range enforcement applies to pull_request events."
              baseline_check "dispatch" "$IG_SHA"
              ;;
            *)
              fail "unsupported event '$event' - no defined new-commit set"
              ;;
          esac

  macos:
    needs: identity-guard
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Anchor hard 35 min job clock before checkout and builds
        run: |
          echo "SPZ_JOB_DEADLINE_EPOCH=$(( $(date +%s) + 2100 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare artifact dir, fixture dir and compile deadline (after checkout, which cleans the workspace)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/perf-out" "$GITHUB_WORKSPACE/dist-pkg"
          echo "PERF_FIX=$RUNNER_TEMP/perf2fix" >> "$GITHUB_ENV"
          echo "SPZ_COMPILE_DEADLINE_EPOCH=$(( SPZ_JOB_DEADLINE_EPOCH - 410 ))" >> "$GITHUB_ENV"
      - name: Toolchain versions
        run: |
          sw_vers; uname -m; xcodebuild -version; swift --version; rustc --version; cargo --version; python3 --version
          { sw_vers; uname -m; echo "sha=${{ github.sha }} run_id=${{ github.run_id }} attempt=${{ github.run_attempt }}"; } > perf-out/run-context.txt
      - name: Build the engine CLI (spz)
        id: spz
        run: |
          set -o pipefail
          python3 scripts/run-with-deadline.py cargo build --release --locked -p spacelyzer-engine --bin spz 2>&1 | tee perf-out/spz-build.log
          test -x target/release/spz
      - name: LEG 1 accuracy 1k/10k/100k (isolated; verdict file owns the result)
        id: accuracy
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 9
        run: |
          python3 scripts/perf2-leg.py --leg accuracy --out perf-out/accuracy --work 400 --prereq spz='${{ steps.spz.outcome }}' -- python3 scripts/perf2-accuracy.py --spz target/release/spz --out perf-out/accuracy --budget 380
      - name: Build universal engine
        id: engine
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/run-with-deadline.py ./scripts/build-engine.sh 2>&1 | tee perf-out/engine-build.log
      - name: Build Swift app
        id: swiftapp
        if: ${{ always() && steps.engine.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/run-with-deadline.py bash scripts/shipping-swift.sh -c release --arch arm64 --arch x86_64 2>&1 | tee perf-out/swift-build.log
      - name: Import self-signed identity
        id: sign
        if: ${{ always() && steps.swiftapp.outcome == 'success' }}
        continue-on-error: true
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          HASH="$(./scripts/sign-setup.sh | tail -1)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
      - name: Assemble the signed app into dist-pkg (the DMG it also produces is never uploaded)
        id: pkg
        if: ${{ always() && steps.sign.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 7
        env:
          SPZ_DIST: dist-pkg
        run: |
          python3 scripts/run-with-deadline.py ./scripts/package-dmg.sh "0.1.${{ github.run_number }}-perf2" "${{ steps.sign.outputs.hash }}"
          test -x dist-pkg/Spacelyzer.app/Contents/MacOS/Spacelyzer
      - name: Compile the M3 interaction bench and readiness probe
        id: tools
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/run-with-deadline.py swiftc -O -o "$RUNNER_TEMP/m3bench" scripts/m3-interaction-bench.swift 2>&1 | tee perf-out/bench-compile.txt
          python3 scripts/run-with-deadline.py swiftc -O -o "$RUNNER_TEMP/m3-readiness" scripts/m3-readiness.swift 2>&1 | tee -a perf-out/bench-compile.txt
          shasum -a 256 "$RUNNER_TEMP/m3bench" "$RUNNER_TEMP/m3-readiness" | tee -a perf-out/bench-compile.txt
      - name: Fixtures generate and verify (typing-200k, expansion-10k)
        id: fixtures
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -o pipefail
          python3 scripts/make_fixtures.py generate "$PERF_FIX/typing" --profile typing-200k 2>&1 | tee perf-out/fixtures.txt
          python3 scripts/make_fixtures.py verify "$PERF_FIX/typing" --profile typing-200k 2>&1 | tee -a perf-out/fixtures.txt
          python3 scripts/make_fixtures.py generate "$PERF_FIX/exp" --profile expansion-10k 2>&1 | tee -a perf-out/fixtures.txt
          python3 scripts/make_fixtures.py verify "$PERF_FIX/exp" --profile expansion-10k 2>&1 | tee -a perf-out/fixtures.txt
      - name: LEG 2 stability and responsiveness (isolated; verdict file owns the result)
        id: stability
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 14
        run: |
          python3 scripts/perf2-leg.py --leg stability --out perf-out/stability --work 700 --prereq spz='${{ steps.spz.outcome }}' --prereq pkg='${{ steps.pkg.outcome }}' --prereq tools='${{ steps.tools.outcome }}' --prereq fixtures='${{ steps.fixtures.outcome }}' -- bash scripts/perf2-stability.sh "$GITHUB_WORKSPACE/dist-pkg/Spacelyzer.app" "$GITHUB_WORKSPACE/target/release/spz" "$PERF_FIX" "$GITHUB_WORKSPACE/perf-out/stability" "$GITHUB_WORKSPACE/scripts" "$RUNNER_TEMP/m3bench" "$RUNNER_TEMP/m3-readiness"
      - name: Stop any app left running
        if: ${{ always() }}
        continue-on-error: true
        run: pkill Spacelyzer || true
      - name: Build the TEST-ONLY perf app (SPZ_CI_TESTS + SPZ_CI_PERF; never packaged, uploaded or released)
        id: perfbuild
        if: ${{ always() && steps.engine.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 9
        run: |
          set -o pipefail
          SPZ_TEST_EXTRA_DEFINES="SPZ_CI_PERF" python3 scripts/run-with-deadline.py bash ./scripts/build-test-app.sh dist-test "" 2>&1 | tee perf-out/test-build.log
          test -x dist-test/Spacelyzer.app/Contents/MacOS/Spacelyzer
      - name: LEG 3 cancel latency n=3 (isolated; verdict file owns the result)
        id: cancel
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python3 scripts/perf2-leg.py --leg cancel --out perf-out/cancel --work 240 --prereq perfbuild='${{ steps.perfbuild.outcome }}' --prereq fixtures='${{ steps.fixtures.outcome }}' -- bash scripts/perf2-cancel.sh "$GITHUB_WORKSPACE/dist-test/Spacelyzer.app" "$PERF_FIX/typing/typing-200k" "$GITHUB_WORKSPACE/perf-out/cancel" "$GITHUB_WORKSPACE/scripts" 20000 3
      - name: Stop any app left running (again)
        if: ${{ always() }}
        continue-on-error: true
        run: pkill Spacelyzer || true
      - name: Combined perf evidence summary and gate (runs BEFORE the upload so SUMMARY.md is inside the artifact; enforced by the last step)
        id: gate
        if: ${{ always() }}
        continue-on-error: true
        run: |
          python3 scripts/perf2-gate.py perf-out accuracy,stability,cancel
      - uses: actions/upload-artifact@v4
        id: perf_artifact
        if: ${{ always() }}
        with:
          name: perf-run2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: perf-out/
      - name: Enforce (red unless the gate passed and the artifact uploaded)
        if: ${{ always() }}
        run: |
          [ '${{ steps.gate.outcome }}' = success ] && [ '${{ steps.perf_artifact.outcome }}' = success ] || { echo "::error::perf run 2 not green: gate=${{ steps.gate.outcome }} artifact=${{ steps.perf_artifact.outcome }} (see SUMMARY.md)"; exit 1; }
