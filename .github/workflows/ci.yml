name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release -p spacelyzer-engine
      - run: cargo build --release
      - name: Scan benchmark (informational, shared runner)
        run: ./target/release/spz bench /usr 3

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          sw_vers; xcodebuild -version; swift --version; rustc --version || true
      - name: Rust engine tests (native macOS, includes getattrlistbulk backend)
        run: |
          rustup update stable --no-self-update
          set -o pipefail
          cargo test --release -p spacelyzer-engine -- --nocapture 2>&1 | tee /tmp/cargotest.log || {
            grep -E -A3 "panicked|firmlink check" /tmp/cargotest.log | grep -v "^--" | sort -u | head -12 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }
          grep -E "firmlink check" /tmp/cargotest.log | while IFS= read -r l; do echo "::notice::${l//%/%25}"; done
      - name: Bulk backend vs portable backend on real macOS trees
        run: |
          cargo build --release -p spacelyzer-engine
          for d in /Applications /usr/lib "$HOME/Library"; do
            [ -d "$d" ] && ./target/release/spz verify "$d" || true
          done
          ./target/release/spz verify /Applications
      - name: Scan benchmark (informational, shared runner)
        run: ./target/release/spz bench /Applications 3
      - name: Build universal engine
        run: ./scripts/build-engine.sh
      - name: Build Swift app
        run: |
          set -o pipefail
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tee /tmp/swiftbuild.log || {
            grep -E "error:" /tmp/swiftbuild.log | sort -u | head -15 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }
      - name: Version
        id: ver
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Import self-signed identity
        id: sign
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          HASH="$(./scripts/sign-setup.sh | tail -1)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
      - name: Package signed DMG
        run: ./scripts/package-dmg.sh "${{ steps.ver.outputs.version }}" "${{ steps.sign.outputs.hash }}"
      - name: Launch app and screenshot (informational)
        continue-on-error: true
        run: |
          open -n dist/Spacelyzer.app --env SPZ_AUTOSCAN=/Library
          sleep 8
          screencapture -x dist/screenshot-scanning.png || true
          sleep 35
          screencapture -x dist/screenshot.png || true
          pgrep -fl Spacelyzer || echo "app not running"
          pkill Spacelyzer || true
          sleep 2
          # Scripted interaction run: the app writes /tmp/spz-demo-step after each state settles.
          rm -f /tmp/spz-demo-step /tmp/spz-geom.txt /tmp/spz-timing.txt
          open -n dist/Spacelyzer.app --env SPZ_AUTOSCAN=/Library --env SPZ_DEMO=1
          for step in 1 2 3 4 5 6; do
            for i in $(seq 1 90); do [ "$(cat /tmp/spz-demo-step 2>/dev/null)" = "$step" ] && break; sleep 1; done
            sleep 1
            screencapture -x dist/screenshot-demo-$step.png || true
          done
          # Keyboard/focus regressions on the expanded 153k-row outline, driven with real key events.
          keys() { osascript -e "tell application \"System Events\" to $1" 2>&1 | head -2 | sed 's/^/osascript: /' >> /tmp/spz-timing.txt; }
          echo "kbd: begin" >> /tmp/spz-timing.txt
          osascript -e 'tell application "Spacelyzer" to activate' 2>&1 | sed 's/^/activate: /' >> /tmp/spz-timing.txt; sleep 2
          osascript -e 'tell application "System Events" to get name of first process whose frontmost is true' 2>&1 | sed 's/^/frontmost: /' >> /tmp/spz-timing.txt
          osascript -e 'tell application "System Events" to tell process "Spacelyzer" to get position of window 1' 2>&1 | sed 's/^/winpos: /' >> /tmp/spz-timing.txt
          keys 'click at {200, 166}'; sleep 1
          for i in $(seq 1 40); do keys 'key code 125'; done; sleep 2
          screencapture -x dist/screenshot-demo-7.png || true
          echo "kbd: after 40 down arrows" >> /tmp/spz-timing.txt
          keys 'click at {180, 107}'; sleep 1
          keys 'keystroke "lib"'; sleep 2
          echo "kbd: filter typed, now 5 down arrows in filter field" >> /tmp/spz-timing.txt
          for i in $(seq 1 5); do keys 'key code 125'; done; sleep 2
          screencapture -x dist/screenshot-demo-8.png || true
          keys 'key code 0 using command down'; keys 'keystroke "zzzqqq"'; sleep 3
          echo "kbd: no-match query" >> /tmp/spz-timing.txt
          screencapture -x dist/screenshot-demo-9.png || true
          sleep 2
          if [ -f /tmp/spz-timing.txt ]; then
            body=$(sed 's/%/%25/g' /tmp/spz-timing.txt | awk '{printf "%s%%0A", $0}' | head -c 30000)
            echo "::notice title=timing::$body"
          fi
          pkill Spacelyzer || true
      - uses: actions/upload-artifact@v4
        with:
          name: Spacelyzer-${{ steps.ver.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/screenshot*.png
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=v${{ steps.ver.outputs.version }}
          gh release create "$V" dist/*.dmg dist/*.sha256 dist/screenshot*.png --title "Spacelyzer $V" --prerelease \
            --notes "Self-signed development build (not notarized). Not Apple-verified: after the first blocked open, use System Settings > Privacy & Security > Open Anyway. Screenshots attached are from the CI runner, not a real Mac. Built from ${{ github.sha }}."
