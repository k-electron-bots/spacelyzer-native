# Measurement-only replacement of ci.yml on THIS branch only (mac-stall-soak-00aa46a2).
# Product tree pinned at 00aa46a2 (item-inspect-engine-stack tip) EXCEPT three named
# instrumentation files carrying the bounded-ping-v1 diff (semantics staged for review):
#   Sources/Spacelyzer/Engine.swift        (MainStall bounded-ping redesign + monitor-thread writer + phase channel)
#   Sources/Spacelyzer/SpacelyzerApp.swift (SPZ_STALL_MONITOR start gate, SPZ_DIAG_RESCAN in-process rescan trigger)
#   Sources/Spacelyzer/AppModel.swift      (scan lifecycle phase/swap records - inert unless the monitor runs)
# plus this workflow and scripts/measure/*. No release, no tag, no DMG packaging here.
# Everything below is a shared-runner RESPONSIVENESS PROXY (AX interaction latency);
# it is not frame-pacing evidence and clears no real-hardware UI gate.
# INSTRUMENTATION SEPARATION (pre-registered): bar-gated probes (baseline/type/expand/menu/
# cancel) run UNINSTRUMENTED. The bounded-ping monitor runs only in launches labeled
# diagnostic (SPZ_STALL_MONITOR + SPZ_STALL_LOG_DIR); their telemetry is investigation
# context for the unresolved scan-window stall and closes no gate. Declared monitor cost:
# ~200 main-queue closures/sec while responsive, at most 1 outstanding during a block (no
# backlog, no drain storm), JSONL writer on the monitor thread only, never on main.
# PRE-REGISTERED (before any data): the concurrent `sample` capture is CONTEXT ONLY - the
# aggregated report has no per-snapshot frames, so no block durations are inferred from it and
# it closes no gate; it exists to adjudicate AX-side outliers. The real main-thread stall gate
# remains UNCLOSED unless valid instrumentation lands later. The binding interaction rule is
# the AX tail policy in evaluate.py (p95 + max binding, 1-over OUTLIER-unresolved, floor n>=20).
# evaluate.py --selftest runs before evaluation so malformed/absent evidence can never PASS.
name: CI
on:
  workflow_dispatch:
    inputs:
      compile_only:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read   # gh run download of the pinned existing artifact for hash/signature validation
env:
  # Pre-registered verdict bars (before any result exists). Grounding: 100 ms = the classic
  # direct-manipulation "feels instantaneous" boundary (Nielsen response-time limits), 1000 ms =
  # uninterrupted-flow boundary; expand gets a work-allowed p95 because opening a huge folder does
  # real enumeration work, still under the flow boundary. Values outside PASS but under *_MAX are
  # reported as OUTLIERS with an honest verdict, never silently passed (the ~140 ms calibration
  # AX-read outliers land here by design).
  STALL_TYPING_P95_MS: "100"
  STALL_TYPING_MAX_MS: "1000"
  # menu = AXShowMenu proxy for hover cost (NOT pointer hover); menus dismissed between samples
  STALL_MENU_P95_MS: "100"
  STALL_MENU_MAX_MS: "1000"
  STALL_EXPAND_P95_MS: "250"
  STALL_EXPAND_MAX_MS: "1000"
  CANCEL_RESPONSIVE_MAX_MS: "1000"
  DIST_MIN_SAMPLES: "20"             # floor: per-interaction latency samples before a verdict is issued
  SOAK_GROWTH_MAX: "1.10"            # final-third median live RSS / first-third median
  SOAK_SEPARATE_BAND: "0.10"         # separate-process peak RSS band +/-10%
jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the Pin step diffs against base 00aa46a2 (depth 1 broke run 38454259263)
      - name: Pin and context
        run: |
          echo "branch tip: $(git rev-parse HEAD) (product base 00aa46a2 + workflow + scripts/measure + two named instrumentation files)"
          DIFF=$(git diff --name-only 00aa46a2d384ec4648ae4571ccb2eaee5a7e6324 HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)scripts/measure' ':(exclude)Sources/Spacelyzer/Engine.swift' ':(exclude)Sources/Spacelyzer/SpacelyzerApp.swift' ':(exclude)Sources/Spacelyzer/AppModel.swift')
          if [ -n "$DIFF" ]; then echo "::error::product tree differs from reviewed 00aa46a2 beyond the named instrumentation files: $DIFF"; exit 1; fi
          echo "product tree == 00aa46a2 EXCEPT Engine.swift + SpacelyzerApp.swift + AppModel.swift (bounded-ping-v1 instrumentation; rest of tree verified)"
          git diff --stat 00aa46a2d384ec4648ae4571ccb2eaee5a7e6324 HEAD -- Sources/Spacelyzer/Engine.swift Sources/Spacelyzer/SpacelyzerApp.swift Sources/Spacelyzer/AppModel.swift
          # Fail closed if the named instrumentation files drift from the exact reviewed content:
          # a branch move must stop measurement BEFORE it runs, not after exclude+diffstat alone.
          ESHA=$(git hash-object Sources/Spacelyzer/Engine.swift)
          ASHA=$(git hash-object Sources/Spacelyzer/SpacelyzerApp.swift)
          MSHA=$(git hash-object Sources/Spacelyzer/AppModel.swift)
          [ "$ESHA" = "9b8a7b74ab7f004a85e1f03b30d3339b6c4c9123" ] || { echo "::error::Engine.swift drifted from the reviewed instrumentation blob ($ESHA)"; exit 1; }
          [ "$ASHA" = "2d4186df3dd7aec04ae1f568fa38b9f08a2d6b0a" ] || { echo "::error::SpacelyzerApp.swift drifted from the reviewed instrumentation blob ($ASHA)"; exit 1; }
          [ "$MSHA" = "028a9323ed9be96e30fe3083f5c73ace7944282b" ] || { echo "::error::AppModel.swift drifted from the reviewed instrumentation blob ($MSHA)"; exit 1; }
          echo "instrumentation files pinned at exact reviewed blobs Engine=$ESHA App=$ASHA AppModel=$MSHA"
          # Job-start epoch: measurement steps derive remaining-job-aware budgets from this
          # (job timeout-minutes is 35; reserve covers the gates after the cancel step + upload).
          date +%s > "$RUNNER_TEMP/spz-job-start"
          sw_vers; xcodebuild -version; swift --version
      - name: Compile harness drivers (fails cheap before any measurement)
        run: |
          swiftc -swift-version 5 scripts/measure/stall-driver.swift -o /tmp/spz-stall-driver
          shasum -a 256 scripts/measure/stall-driver.swift /tmp/spz-stall-driver
      - name: Rust engine build
        run: |
          rustc --version; cargo --version   # actual toolchain used (no rustup update; runner default pinned by the image)
          cargo build --release -p spacelyzer-engine
      - name: Rust engine tests with fresh skip manifest (EILSEQ evidence)
        if: ${{ !inputs.compile_only }}
        run: |
          set -o pipefail
          mkdir -p measure-out
          export SPZ_ALLOW_PLATFORM_SKIP=1
          export SPZ_SKIP_MANIFEST="$RUNNER_TEMP/spz-skip-manifest.txt"
          : > "$SPZ_SKIP_MANIFEST"
          status=0
          cargo test --release -p spacelyzer-engine --no-fail-fast -- --nocapture 2>&1 | tee /tmp/cargotest.log || status=$?
          cp "$SPZ_SKIP_MANIFEST" measure-out/skip-manifest.txt
          grep -E "deep" /tmp/cargotest.log | head -5 > measure-out/deepnest-mac.log || true
          raw_passed=$(awk '/^test result:/ {for (i = 2; i <= NF; i++) if ($i == "passed;") n += $(i-1)} END {print n + 0}' /tmp/cargotest.log)
          skipped=$(grep -c . "$SPZ_SKIP_MANIFEST" || true)
          echo "::notice title=engine-tests::raw passed=$raw_passed; NOT EXERCISED=$skipped (manifest uploaded); exercised=$((raw_passed - skipped)); cargo exit=$status"
          exit "$status"
      - name: Build Swift app + sign (existing project self-signed identity only)
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          ./scripts/build-engine.sh
          swift build -c release --arch arm64 --arch x86_64
          HASH="$(./scripts/sign-setup.sh | tail -1)"
          echo "signhash=$HASH" >> "$GITHUB_ENV"
          ./scripts/package-dmg.sh "0.0.measure" "$HASH"
      - name: Stall responsiveness proxies (typing / hover / expand + main-thread sample)
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p measure-out
          # Owned-PID cleanup: TERM the exact process this step launched, grace, then KILL only that
          # PID (run 38486848714 evidence: name-based pkill + AX calls blocked past poll bounds).
          kill_owned() {
            [ -n "$1" ] || return 0
            kill -TERM "$1" 2>/dev/null || true
            for k in $(seq 1 10); do kill -0 "$1" 2>/dev/null || break; sleep 0.5; done
            kill -0 "$1" 2>/dev/null && kill -KILL "$1" 2>/dev/null || true
          }
          echo "marker ts_ms=$(($(date +%s)*1000)) stage=initial-launch"
          open -n dist/Spacelyzer.app --env SPZ_AUTOSCAN=/Library
          PID=""
          for i in $(seq 1 60); do PID=$(pgrep -x Spacelyzer | head -1); [ -n "$PID" ] && break; sleep 0.5; done
          [ -n "$PID" ] || { echo "::error::app did not launch"; exit 1; }
          echo "marker ts_ms=$(($(date +%s)*1000)) stage=initial-pid pid=$PID"
          # External wall-clock watchdog (pure bash, no coreutils dependency): runs one command,
          # TERM at the limit, KILL 15s later, passes the exit code through (124 on timeout).
          # Survives any in-process block; driver also self-limits (see stall-driver.swift header).
          run_bounded() {
            local limit=$1; shift
            local flag; flag=$(mktemp "${TMPDIR:-/tmp}/spzwatch.XXXXXX")
            "$@" & local cpid=$!
            ( i=0; while [ "$i" -lt "$limit" ]; do sleep 1; i=$((i+1)); done
              echo 1 > "$flag"
              kill -TERM "$cpid" 2>/dev/null
              i=0; while [ "$i" -lt 15 ]; do sleep 1; kill -0 "$cpid" 2>/dev/null || break; i=$((i+1)); done
              kill -KILL "$cpid" 2>/dev/null ) & local wpid=$!
            local rc=0
            wait "$cpid" || rc=$?
            kill "$wpid" 2>/dev/null || true
            wait "$wpid" 2>/dev/null || true
            if [ -s "$flag" ]; then echo "WATCHDOG-EXTERNAL timeout_s=$limit cmd=$1"; rc=124; fi
            rm -f "$flag"
            return "$rc"
          }
          # Step wall-clock budget: 15 min, capped by the remaining job budget (35-min job,
          # 10-min reserve for the gates after the cancel step + artifact upload). Required calls
          # (waitwindow, baseline) always run; optional probes are SKIPPED with an honest marker
          # once the budget is exhausted, so a wedged environment can never burn the whole job
          # producing near-zero evidence.
          # Fail closed on missing job-start: without the epoch the reserve math is fiction
          # (resetting the clock here is how the 10-min reserve evaporates).
          if ! JOB_START=$(cat "$RUNNER_TEMP/spz-job-start" 2>/dev/null); then
            echo "::error::job-start epoch missing - budgets underivable, refusing to run"
            kill_owned "$PID"
            exit 1
          fi
          RESERVE_END=$(( JOB_START + 2100 - 600 ))
          STEP_END=$(( $(date +%s) + 900 ))
          if [ "$STEP_END" -gt "$RESERVE_END" ]; then STEP_END=$RESERVE_END; fi
          # budgeted_run <limit> <label> <cmd...>: clips the per-call watchdog to the ACTUAL
          # remaining step budget minus 20s (TERM/KILL grace + cleanup slack), and skips with an
          # honest marker + rc 125 when the remainder cannot hold the call. Budget pre-checks
          # alone are NOT a hard cap - this clipping is what preserves the post-gate reserve.
          budgeted_run() {
            local requested=$1 label=$2; shift 2
            local remain=$(( STEP_END - $(date +%s) - 20 ))
            local limit=$requested
            if [ "$remain" -lt "$limit" ]; then limit=$remain; fi
            if [ "$limit" -lt 30 ]; then
              echo "marker ts_ms=$(($(date +%s)*1000)) stage=$label-skipped-insufficient-budget"
              return 125
            fi
            run_bounded "$limit" "$@"
          }
          WRC=0
          budgeted_run 300 waitwindow /tmp/spz-stall-driver waitwindow "$PID" || WRC=$?
          if [ "$WRC" -ne 0 ]; then echo "::error::no AX window rc=$WRC"; kill_owned "$PID"; exit 1; fi
          sample "$PID" 30 10 -file /tmp/spz-main-sample.txt &   # CONTEXT ONLY - not instrumentation (see header)
          SAMPLEPID=$!
          # Baseline guarded: on failure the step STILL preserves the partial main-thread sample
          # and always kills the owned PID before exiting non-zero (run 38486848714 review:
          # an unguarded baseline bypassed both).
          RC=0
          budgeted_run 300 baseline /tmp/spz-stall-driver baseline "$PID" measure-out/ax-baseline.jsonl || RC=$?
          echo "marker ts_ms=$(($(date +%s)*1000)) stage=baseline-done rc=$RC"
          if [ "$RC" -eq 0 ]; then
            budgeted_run 300 type /tmp/spz-stall-driver type "$PID" measure-out/ax-type.jsonl "keep-tag-0001-measurement-stall-pass" || true
            budgeted_run 300 expand /tmp/spz-stall-driver expand "$PID" measure-out/ax-expand.jsonl || true
            budgeted_run 300 nonascii /tmp/spz-stall-driver nonascii "$PID" measure-out/ax-nonascii.jsonl || true
          else
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=probes-skipped-baseline-failed"
          fi
          echo "marker ts_ms=$(($(date +%s)*1000)) stage=initial-measurements-done"
          wait "$SAMPLEPID" || true
          cp /tmp/spz-main-sample.txt measure-out/main-thread-sample.txt || true
          kill_owned "$PID"
          [ "$RC" -eq 0 ] || { echo "::error::baseline measurement failed rc=$RC (sample preserved, owned PID cleaned)"; exit 1; }
      - name: Cancel/rescan cycles + post-cancel responsiveness
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p measure-out
          kill_owned() {
            [ -n "$1" ] || return 0
            kill -TERM "$1" 2>/dev/null || true
            for k in $(seq 1 10); do kill -0 "$1" 2>/dev/null || break; sleep 0.5; done
            kill -0 "$1" 2>/dev/null && kill -KILL "$1" 2>/dev/null || true
          }
          # External wall-clock watchdog (pure bash, no coreutils dependency): runs one command,
          # TERM at the limit, KILL 15s later, passes the exit code through (124 on timeout).
          # Survives any in-process block; driver also self-limits (see stall-driver.swift header).
          run_bounded() {
            local limit=$1; shift
            local flag; flag=$(mktemp "${TMPDIR:-/tmp}/spzwatch.XXXXXX")
            "$@" & local cpid=$!
            ( i=0; while [ "$i" -lt "$limit" ]; do sleep 1; i=$((i+1)); done
              echo 1 > "$flag"
              kill -TERM "$cpid" 2>/dev/null
              i=0; while [ "$i" -lt 15 ]; do sleep 1; kill -0 "$cpid" 2>/dev/null || break; i=$((i+1)); done
              kill -KILL "$cpid" 2>/dev/null ) & local wpid=$!
            local rc=0
            wait "$cpid" || rc=$?
            kill "$wpid" 2>/dev/null || true
            wait "$wpid" 2>/dev/null || true
            if [ -s "$flag" ]; then echo "WATCHDOG-EXTERNAL timeout_s=$limit cmd=$1"; rc=124; fi
            rm -f "$flag"
            return "$rc"
          }
          # Step wall-clock budget 25 min, capped by the remaining job budget (35-min job, 10-min
          # reserve), + fail-fast: a wedged environment (first external watchdog timeout) aborts
          # remaining cycles instead of repeating a zero-evidence pattern. The budget is set BEFORE
          # fixture generation so generation time counts against it.
          # Fail closed on missing job-start (see stall step).
          if ! JOB_START=$(cat "$RUNNER_TEMP/spz-job-start" 2>/dev/null); then
            echo "{\"note\":\"job-start-missing\"}" >> measure-out/cancel-cycles.jsonl
            echo "::error::job-start epoch missing - budgets underivable, refusing to run"
            exit 1
          fi
          RESERVE_END=$(( JOB_START + 2100 - 600 ))
          STEP_END=$(( $(date +%s) + 1500 ))
          if [ "$STEP_END" -gt "$RESERVE_END" ]; then STEP_END=$RESERVE_END; fi
          # budgeted_run <limit> <label> <cmd...>: clips the per-call watchdog to the ACTUAL
          # remaining step budget minus 20s (TERM/KILL grace + cleanup slack), and skips with an
          # honest marker + rc 125 when the remainder cannot hold the call. Budget pre-checks
          # alone are NOT a hard cap - this clipping is what preserves the post-gate reserve.
          budgeted_run() {
            local requested=$1 label=$2; shift 2
            local remain=$(( STEP_END - $(date +%s) - 20 ))
            local limit=$requested
            if [ "$remain" -lt "$limit" ]; then limit=$remain; fi
            if [ "$limit" -lt 30 ]; then
              echo "marker ts_ms=$(($(date +%s)*1000)) stage=$label-skipped-insufficient-budget"
              return 125
            fi
            run_bounded "$limit" "$@"
          }

          # Bounded scan fixture lengthens the REAL scan window so the Stop control is observable
          # (rationale + numbers in scripts/measure/make-cancel-fixture.sh). One-time generation,
          # watchdogged (run 38486848714: 4m07s generation ran unbounded, outside any budget).
          # Pre-guard: do not START generation when the remaining budget cannot hold it
          # (observed generation 247s; guard floor 300s) - an honest skip, never a clipped attempt.
          if [ "$(( STEP_END - $(date +%s) ))" -lt 300 ]; then
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=fixture-skipped-insufficient-budget"
            echo "{\"note\":\"fixture-skipped-insufficient-budget\"}" >> measure-out/cancel-cycles.jsonl
            exit 0
          fi
          RC=0
          budgeted_run 480 fixture-generation bash scripts/measure/make-cancel-fixture.sh "$RUNNER_TEMP/spz-cancel-fixture" || RC=$?
          FIX="$RUNNER_TEMP/spz-cancel-fixture"
          echo "marker ts_ms=$(($(date +%s)*1000)) stage=fixture-generation-done rc=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "{\"note\":\"fixture-generation-failed\",\"rc\":$RC}" >> measure-out/cancel-cycles.jsonl
            echo "::error::fixture generation failed rc=$RC - no cancel cycles possible"
            exit 1
          fi
          for i in 1 2 3; do
            if [ "$(date +%s)" -ge "$STEP_END" ]; then
              echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-skipped-budget-exhausted"
              echo "{\"cycle\":$i,\"note\":\"skipped-budget-exhausted\"}" >> measure-out/cancel-cycles.jsonl
              break
            fi
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-launch"
            open -n dist/Spacelyzer.app --env SPZ_AUTOSCAN="$FIX"
            PID=""
            for j in $(seq 1 100); do PID=$(pgrep -x Spacelyzer | head -1); [ -n "$PID" ] && break; sleep 0.1; done
            [ -n "$PID" ] || { echo "{\"cycle\":$i,\"note\":\"no-process\"}" >> measure-out/cancel-cycles.jsonl; continue; }
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-pid pid=$PID"
            # waitwindow result propagated honestly: a failed window wait skips the cancel call
            # (never burns another 300s against a wedged app); a timeout triggers the fail-fast.
            WRC=0
            budgeted_run 300 cycle-$i-waitwindow /tmp/spz-stall-driver waitwindow "$PID" || WRC=$?
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-waitwindow-done rc=$WRC"
            if [ "$WRC" -eq 125 ]; then
              echo "{\"cycle\":$i,\"note\":\"cycles-aborted-insufficient-budget\",\"phase\":\"waitwindow\"}" >> measure-out/cancel-cycles.jsonl
              kill_owned "$PID"
              break
            fi
            if [ "$WRC" -ne 0 ]; then
              echo "{\"cycle\":$i,\"note\":\"waitwindow-failed\",\"rc\":$WRC}" >> measure-out/cancel-cycles.jsonl
              kill_owned "$PID"
              echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-cleanup-done"
              if [ "$WRC" -eq 124 ]; then
                echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycles-aborted-first-timeout"
                echo "{\"cycle\":$i,\"note\":\"cycles-aborted-first-timeout\",\"phase\":\"waitwindow\"}" >> measure-out/cancel-cycles.jsonl
                break
              fi
              continue
            fi
            # driver polls from t=0 for the actual "Stop scan" button; a missed window is an honest
            # error row, never a fabricated press
            RC=0
            budgeted_run 300 cycle-$i-cancel /tmp/spz-stall-driver cancel "$PID" "measure-out/cancel-cycle-$i.jsonl" || RC=$?
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-cancel-done rc=$RC"
            kill_owned "$PID"
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-cleanup-done"
            if [ "$RC" -eq 125 ]; then
              echo "{\"cycle\":$i,\"note\":\"cycles-aborted-insufficient-budget\",\"phase\":\"cancel\"}" >> measure-out/cancel-cycles.jsonl
              break
            fi
            if [ "$RC" -eq 124 ]; then
              echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycles-aborted-first-timeout"
              echo "{\"cycle\":$i,\"note\":\"cycles-aborted-first-timeout\",\"phase\":\"cancel\"}" >> measure-out/cancel-cycles.jsonl
              break
            fi
          done

          # --- Instrumented diagnostic launches: LABELED diagnostic, NEVER bar-compared ---
          # (pre-registered separation, see header). The bounded-ping monitor runs here only;
          # telemetry = per-launch append+flush JSONL copied into
          # measure-out/stall-telemetry/diagnostic/. Closes no gate. CHAIN RULE: each
          # diagnostic runs only when the previous one exited 0 - a failed environment
          # (ANY non-zero rc, not just a 124 timeout) aborts the rest with an honest note
          # instead of repeating a zero-evidence pattern.
          # Coverage declarations: the scan-window watch caps at 120s - it SAMPLES the scan
          # window and CANNOT cover an 18-minute stall window (run 2's AX gap was 18.1 min);
          # its 1 Hz AX Stop-presence poll is a DECLARED observer load on the target.
          # The rescan diagnostic carries ZERO AX load (fully in-process rescan trigger,
          # SPZ_DIAG_RESCAN; no driver calls) and covers scan A completion + spacing +
          # rescan B through its completion - the ONLY window where `tree = t` drops the
          # old tree on the main actor (AppModel scan completion). A fresh launch's first
          # completion drops nothing (tree was nil); a cancel installs nothing - only a
          # completed-A -> rescan-B sequence observes the old-tree recursive drop.
          # NOT GUARANTEED: the 300s cap may expire during scan A on a slow actual path.
          # DISTINCT OUTCOMES (from phase records, never inferred from wall clock): scan A
          # still running at cap (scan-start without completion-install-begin/scan-failed),
          # scan A failed (scan-failed), rescan B not reached (tree-installed gen g without
          # scan-start gen g+1), or swap recorded (swap record, generation >= 2 = real old
          # tree). Only the last is drop coverage; the others are reported as reached states,
          # never as drop evidence.
          mkdir -p "$RUNNER_TEMP/spz-stall-logs" measure-out/stall-telemetry/diagnostic
          DRC=0
          budgeted_run 480 diagnostic-rescan-old-tree-drop bash scripts/measure/diagnostic-watch.sh dist/Spacelyzer.app /tmp/spz-stall-driver "$FIX" "$RUNNER_TEMP/spz-stall-logs" measure-out/stall-telemetry/diagnostic 300 rescan || DRC=$?
          echo "marker ts_ms=$(($(date +%s)*1000)) stage=diagnostic-rescan-done rc=$DRC"
          if [ "$DRC" -ne 0 ]; then
            echo "{\"note\":\"diagnostic-chain-aborted\",\"after\":\"rescan\",\"rc\":$DRC}" >> measure-out/stall-telemetry/diagnostic/diagnostic-notes.jsonl
          else
            budgeted_run 300 diagnostic-scan-window-watch bash scripts/measure/diagnostic-watch.sh dist/Spacelyzer.app /tmp/spz-stall-driver "$FIX" "$RUNNER_TEMP/spz-stall-logs" measure-out/stall-telemetry/diagnostic 120 || DRC=$?
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=diagnostic-watch-done rc=$DRC"
            if [ "$DRC" -ne 0 ]; then
              echo "{\"note\":\"diagnostic-chain-aborted\",\"after\":\"watch\",\"rc\":$DRC}" >> measure-out/stall-telemetry/diagnostic/diagnostic-notes.jsonl
            else
              budgeted_run 300 diagnostic-cancel-instrumented bash scripts/measure/diagnostic-watch.sh dist/Spacelyzer.app /tmp/spz-stall-driver "$FIX" "$RUNNER_TEMP/spz-stall-logs" measure-out/stall-telemetry/diagnostic 120 cancel || DRC=$?
              echo "marker ts_ms=$(($(date +%s)*1000)) stage=diagnostic-cancel-instrumented-done rc=$DRC"
              if [ "$DRC" -ne 0 ]; then
                echo "{\"note\":\"diagnostic-cancel-failed\",\"rc\":$DRC}" >> measure-out/stall-telemetry/diagnostic/diagnostic-notes.jsonl
              fi
            fi
          fi
          cp -np "$RUNNER_TEMP/spz-stall-logs"/spz-stall-*.jsonl measure-out/stall-telemetry/diagnostic/ 2>/dev/null || true

      - name: Engine soak (in-process + separate-process, live-RSS timeline)
        if: ${{ !inputs.compile_only }}
        run: bash scripts/measure/soak.sh ./target/release/spz measure-out /Library
      - name: Poisoned-subtree failure recovery (engine, named failure)
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p measure-out /tmp/spz-poison/sub
          echo x > /tmp/spz-poison/sub/file.txt
          chmod 000 /tmp/spz-poison/sub
          echo "fixture: /tmp/spz-poison/sub chmod 000 - sole constructed defect" | tee measure-out/poison-fixture.txt
          echo "runner-uid=$(id -u)" | tee measure-out/poison-denial.txt
          ls /tmp/spz-poison/sub >> measure-out/poison-denial.txt 2>&1 && echo "PROBE-READABLE" >> measure-out/poison-denial.txt || echo "PROBE-DENIED" >> measure-out/poison-denial.txt
          ./target/release/spz scan /tmp/spz-poison > measure-out/poison-scan.log 2>&1 &
          SCANPID=$!
          for i in $(seq 1 60); do kill -0 "$SCANPID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$SCANPID" 2>/dev/null; then kill -9 "$SCANPID"; RC=124; else wait "$SCANPID"; RC=$?; fi
          echo "poison-scan-exit=$RC" >> measure-out/poison-scan.log
          chmod 755 /tmp/spz-poison/sub
      - name: Volume capability probe (APFS + exFAT disk images, non-UTF-8 errno, cross-device verify)
        if: ${{ !inputs.compile_only }}
        run: bash scripts/measure/volumes.sh ./target/release/spz measure-out
      - name: Cold launch x3 (informational ballpark)
        if: ${{ !inputs.compile_only }}
        run: bash scripts/measure/cold-launch.sh dist/Spacelyzer.app /tmp/spz-stall-driver measure-out
      - name: Pinned-artifact validation (same-run hash + signature evidence)
        if: ${{ !inputs.compile_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p measure-out/artifact
          HEADSHA=$(gh run view 38425289474 --json headSha --jq .headSha)
          echo "artifact run headSha=$HEADSHA" | tee measure-out/artifact/run-headsha.txt
          [ "$HEADSHA" = "00aa46a2d384ec4648ae4571ccb2eaee5a7e6324" ] || { echo "::error::artifact run head $HEADSHA != pinned 00aa46a2"; exit 1; }
          gh run download 38425289474 -n Spacelyzer-0.1.157 -D measure-out/artifact
          ls -la measure-out/artifact
          DMG=$(ls measure-out/artifact/*.dmg | head -1)
          ACTUAL=$(shasum -a 256 "$DMG" | awk '{print $1}')
          EXPECTED=$(awk '{print $1}' measure-out/artifact/*.sha256 | head -1)
          echo "actual=$ACTUAL" | tee measure-out/artifact/dmg-sha256-actual.txt
          echo "ci=$EXPECTED" | tee measure-out/artifact/dmg-sha256-ci.txt
          [ -n "$EXPECTED" ] && [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::DMG hash != CI-recorded sha256"; exit 1; }
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/spz-dmg-mnt
          codesign --verify --deep --strict /tmp/spz-dmg-mnt/Spacelyzer.app 2>&1 | tee measure-out/artifact/codesign-verify.txt || true
          codesign -dv --verbose=4 /tmp/spz-dmg-mnt/Spacelyzer.app 2>&1 | tee measure-out/artifact/codesign-identity.txt || true
          spctl -a -vv -t install /tmp/spz-dmg-mnt/Spacelyzer.app 2>&1 | tee measure-out/artifact/spctl-verdict.txt || true
          hdiutil detach /tmp/spz-dmg-mnt || true
      - name: Evaluator self-test (synthetic regression; malformed/absent evidence never PASSes)
        if: ${{ !inputs.compile_only }}
        run: python3 scripts/measure/evaluate.py --selftest
      - name: Evaluate against pre-registered bars
        if: ${{ !inputs.compile_only }}
        run: python3 scripts/measure/evaluate.py measure-out | tee measure-out/verdicts.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-soak-measurement
          path: measure-out/
          if-no-files-found: warn
