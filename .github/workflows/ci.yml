# Measurement-only replacement of ci.yml on THIS branch only (mac-stall-soak-00aa46a2).
# Product code pinned at 00aa46a2 (item-inspect-engine-stack tip); only this workflow and
# scripts/measure/* differ from the reviewed stack. No release, no tag, no DMG packaging here.
# Everything below is a shared-runner RESPONSIVENESS PROXY (main-thread sample + AX latency);
# it is not frame-pacing evidence and clears no real-hardware UI gate.
name: CI
on:
  workflow_dispatch:
    inputs:
      compile_only:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read   # gh run download of the pinned existing artifact for hash/signature validation
env:
  # Pre-registered verdict bars (before any result exists). Grounding: 100 ms = the classic
  # direct-manipulation "feels instantaneous" boundary (Nielsen response-time limits), 1000 ms =
  # uninterrupted-flow boundary; expand gets a work-allowed p95 because opening a huge folder does
  # real enumeration work, still under the flow boundary. Values outside PASS but under *_MAX are
  # reported as OUTLIERS with an honest verdict, never silently passed (the ~140 ms calibration
  # AX-read outliers land here by design).
  STALL_TYPING_P95_MS: "100"
  STALL_TYPING_MAX_MS: "1000"
  STALL_HOVER_P95_MS: "100"
  STALL_HOVER_MAX_MS: "1000"
  STALL_EXPAND_P95_MS: "250"
  STALL_EXPAND_MAX_MS: "1000"
  CANCEL_RESPONSIVE_MAX_MS: "1000"
  MAIN_THREAD_BLOCK_FAIL_MS: "500"   # one busy gap >= this in the interaction-window sample = FAIL
  MAIN_THREAD_BLOCK_WARN_MS: "100"   # 100-500 ms gaps = reported outliers
  SAMPLE_MIN_SNAPSHOTS: "20"         # floor: sample snapshots across the interaction window
  DIST_MIN_SAMPLES: "10"             # floor: per-interaction latency samples before a verdict is issued
  SOAK_GROWTH_MAX: "1.10"            # final-third median live RSS / first-third median
  SOAK_SEPARATE_BAND: "0.10"         # separate-process peak RSS band +/-10%
jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Pin and context
        run: |
          test "$(git rev-parse HEAD)" = "00aa46a2d384ec4648ae4571ccb2eaee5a7e6324" || { echo "::error::product tree moved from reviewed 00aa46a2"; exit 1; }
          git diff --stat 00aa46a2d384ec4648ae4571ccb2eaee5a7e6324 HEAD || true
          sw_vers; xcodebuild -version; swift --version; rustc --version || true
      - name: Compile harness drivers (fails cheap before any measurement)
        run: |
          swiftc -swift-version 5 scripts/measure/stall-driver.swift -o /tmp/spz-stall-driver
          shasum -a 256 scripts/measure/stall-driver.swift /tmp/spz-stall-driver
      - name: Rust engine build
        run: |
          rustup update stable --no-self-update
          cargo build --release -p spacelyzer-engine
      - name: Rust engine tests with fresh skip manifest (EILSEQ evidence)
        if: ${{ !inputs.compile_only }}
        run: |
          set -o pipefail
          mkdir -p measure-out
          export SPZ_ALLOW_PLATFORM_SKIP=1
          export SPZ_SKIP_MANIFEST="$RUNNER_TEMP/spz-skip-manifest.txt"
          : > "$SPZ_SKIP_MANIFEST"
          status=0
          cargo test --release -p spacelyzer-engine --no-fail-fast -- --nocapture 2>&1 | tee /tmp/cargotest.log || status=$?
          cp "$SPZ_SKIP_MANIFEST" measure-out/skip-manifest.txt
          grep -E "deep" /tmp/cargotest.log | head -5 > measure-out/deepnest-mac.log || true
          raw_passed=$(awk '/^test result:/ {for (i = 2; i <= NF; i++) if ($i == "passed;") n += $(i-1)} END {print n + 0}' /tmp/cargotest.log)
          skipped=$(grep -c . "$SPZ_SKIP_MANIFEST" || true)
          echo "::notice title=engine-tests::raw passed=$raw_passed; NOT EXERCISED=$skipped (manifest uploaded); exercised=$((raw_passed - skipped)); cargo exit=$status"
          exit "$status"
      - name: Build Swift app + sign (existing project self-signed identity only)
        run: |
          ./scripts/build-engine.sh
          swift build -c release --arch arm64 --arch x86_64
          HASH="$(./scripts/sign-setup.sh | tail -1)"
          echo "signhash=$HASH" >> "$GITHUB_ENV"
          ./scripts/package-dmg.sh "0.0.measure" "$HASH"
      - name: Stall responsiveness proxies (typing / hover / expand + main-thread sample)
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p measure-out
          open -n dist/Spacelyzer.app --env SPZ_AUTOSCAN=/Library
          PID=""
          for i in $(seq 1 60); do PID=$(pgrep -x Spacelyzer | head -1); [ -n "$PID" ] && break; sleep 0.5; done
          [ -n "$PID" ] || { echo "::error::app did not launch"; exit 1; }
          /tmp/spz-stall-driver waitwindow "$PID" || { echo "::error::no AX window"; exit 1; }
          sample "$PID" 30 10 -file /tmp/spz-main-sample.txt &
          SAMPLEPID=$!
          /tmp/spz-stall-driver baseline "$PID" measure-out/ax-baseline.jsonl
          /tmp/spz-stall-driver type "$PID" measure-out/ax-type.jsonl "keep-tag-0001" || true
          /tmp/spz-stall-driver expand "$PID" measure-out/ax-expand.jsonl || true
          /tmp/spz-stall-driver nonascii "$PID" measure-out/ax-nonascii.jsonl || true
          wait "$SAMPLEPID" || true
          cp /tmp/spz-main-sample.txt measure-out/main-thread-sample.txt
          pkill -x Spacelyzer || true; sleep 2
      - name: Cancel/rescan cycles + post-cancel responsiveness
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p measure-out
          for i in 1 2 3; do
            open -n dist/Spacelyzer.app --env SPZ_AUTOSCAN=/Applications
            PID=""
            for j in $(seq 1 60); do PID=$(pgrep -x Spacelyzer | head -1); [ -n "$PID" ] && break; sleep 0.5; done
            [ -n "$PID" ] || { echo "cycle $i: no process" >> measure-out/cancel-cycles.jsonl; continue; }
            /tmp/spz-stall-driver waitwindow "$PID" || true
            sleep 4   # mid-scan window on the 1.1M-item tree
            /tmp/spz-stall-driver cancel "$PID" "measure-out/cancel-cycle-$i.jsonl" || true
            pkill -x Spacelyzer || true; sleep 2
          done
      - name: Engine soak (in-process + separate-process, live-RSS timeline)
        if: ${{ !inputs.compile_only }}
        run: bash scripts/measure/soak.sh ./target/release/spz measure-out /Library
      - name: Poisoned-subtree failure recovery (engine, named failure)
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p measure-out /tmp/spz-poison/sub
          echo x > /tmp/spz-poison/sub/file.txt
          chmod 000 /tmp/spz-poison/sub
          ./target/release/spz scan /tmp/spz-poison > measure-out/poison-scan.log 2>&1 &
          SCANPID=$!
          for i in $(seq 1 60); do kill -0 "$SCANPID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$SCANPID" 2>/dev/null; then kill -9 "$SCANPID"; RC=124; else wait "$SCANPID"; RC=$?; fi
          echo "poison-scan-exit=$RC" >> measure-out/poison-scan.log
          chmod 755 /tmp/spz-poison/sub
      - name: Volume capability probe (APFS + exFAT disk images, non-UTF-8 errno, cross-device verify)
        if: ${{ !inputs.compile_only }}
        run: bash scripts/measure/volumes.sh ./target/release/spz measure-out
      - name: Cold launch x3 (informational ballpark)
        if: ${{ !inputs.compile_only }}
        run: bash scripts/measure/cold-launch.sh dist/Spacelyzer.app /tmp/spz-stall-driver measure-out
      - name: Pinned-artifact validation (same-run hash + signature evidence)
        if: ${{ !inputs.compile_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p measure-out/artifact
          gh run download 38425289474 -n Spacelyzer-0.1.157 -D measure-out/artifact
          ls -la measure-out/artifact
          DMG=$(ls measure-out/artifact/*.dmg | head -1)
          shasum -a 256 "$DMG" | tee measure-out/artifact/dmg-sha256-actual.txt
          cat measure-out/artifact/*.sha256 | tee measure-out/artifact/dmg-sha256-ci.txt || true
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/spz-dmg-mnt
          codesign --verify --deep --strict /tmp/spz-dmg-mnt/Spacelyzer.app 2>&1 | tee measure-out/artifact/codesign-verify.txt || true
          codesign -dv --verbose=4 /tmp/spz-dmg-mnt/Spacelyzer.app 2>&1 | tee measure-out/artifact/codesign-identity.txt || true
          spctl -a -vv -t install /tmp/spz-dmg-mnt/Spacelyzer.app 2>&1 | tee measure-out/artifact/spctl-verdict.txt || true
          hdiutil detach /tmp/spz-dmg-mnt || true
      - name: Evaluate against pre-registered bars
        if: ${{ !inputs.compile_only }}
        run: python3 scripts/measure/evaluate.py measure-out | tee measure-out/verdicts.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-soak-measurement
          path: measure-out/
          if-no-files-found: warn
