# Measurement-only replacement of ci.yml on THIS branch only (mac-stall-soak-00aa46a2).
# Product code pinned at 00aa46a2 (item-inspect-engine-stack tip); only this workflow and
# scripts/measure/* differ from the reviewed stack. No release, no tag, no DMG packaging here.
# Everything below is a shared-runner RESPONSIVENESS PROXY (AX interaction latency);
# it is not frame-pacing evidence and clears no real-hardware UI gate.
# PRE-REGISTERED (before any data): the concurrent `sample` capture is CONTEXT ONLY - the
# aggregated report has no per-snapshot frames, so no block durations are inferred from it and
# it closes no gate; it exists to adjudicate AX-side outliers. The real main-thread stall gate
# remains UNCLOSED unless valid instrumentation lands later. The binding interaction rule is
# the AX tail policy in evaluate.py (p95 + max binding, 1-over OUTLIER-unresolved, floor n>=20).
# evaluate.py --selftest runs before evaluation so malformed/absent evidence can never PASS.
name: CI
on:
  workflow_dispatch:
    inputs:
      compile_only:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read   # gh run download of the pinned existing artifact for hash/signature validation
env:
  # Pre-registered verdict bars (before any result exists). Grounding: 100 ms = the classic
  # direct-manipulation "feels instantaneous" boundary (Nielsen response-time limits), 1000 ms =
  # uninterrupted-flow boundary; expand gets a work-allowed p95 because opening a huge folder does
  # real enumeration work, still under the flow boundary. Values outside PASS but under *_MAX are
  # reported as OUTLIERS with an honest verdict, never silently passed (the ~140 ms calibration
  # AX-read outliers land here by design).
  STALL_TYPING_P95_MS: "100"
  STALL_TYPING_MAX_MS: "1000"
  # menu = AXShowMenu proxy for hover cost (NOT pointer hover); menus dismissed between samples
  STALL_MENU_P95_MS: "100"
  STALL_MENU_MAX_MS: "1000"
  STALL_EXPAND_P95_MS: "250"
  STALL_EXPAND_MAX_MS: "1000"
  CANCEL_RESPONSIVE_MAX_MS: "1000"
  DIST_MIN_SAMPLES: "20"             # floor: per-interaction latency samples before a verdict is issued
  SOAK_GROWTH_MAX: "1.10"            # final-third median live RSS / first-third median
  SOAK_SEPARATE_BAND: "0.10"         # separate-process peak RSS band +/-10%
jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the Pin step diffs against base 00aa46a2 (depth 1 broke run 38454259263)
      - name: Pin and context
        run: |
          echo "branch tip: $(git rev-parse HEAD) (differs from product base 00aa46a2: this branch adds the workflow + scripts/measure only)"
          DIFF=$(git diff --name-only 00aa46a2d384ec4648ae4571ccb2eaee5a7e6324 HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)scripts/measure')
          if [ -n "$DIFF" ]; then echo "::error::product tree differs from reviewed 00aa46a2: $DIFF"; exit 1; fi
          echo "product tree == 00aa46a2 (verified, excluding workflow + scripts/measure)"
          sw_vers; xcodebuild -version; swift --version
      - name: Compile harness drivers (fails cheap before any measurement)
        run: |
          swiftc -swift-version 5 scripts/measure/stall-driver.swift -o /tmp/spz-stall-driver
          shasum -a 256 scripts/measure/stall-driver.swift /tmp/spz-stall-driver
      - name: Rust engine build
        run: |
          rustc --version; cargo --version   # actual toolchain used (no rustup update; runner default pinned by the image)
          cargo build --release -p spacelyzer-engine
      - name: Rust engine tests with fresh skip manifest (EILSEQ evidence)
        if: ${{ !inputs.compile_only }}
        run: |
          set -o pipefail
          mkdir -p measure-out
          export SPZ_ALLOW_PLATFORM_SKIP=1
          export SPZ_SKIP_MANIFEST="$RUNNER_TEMP/spz-skip-manifest.txt"
          : > "$SPZ_SKIP_MANIFEST"
          status=0
          cargo test --release -p spacelyzer-engine --no-fail-fast -- --nocapture 2>&1 | tee /tmp/cargotest.log || status=$?
          cp "$SPZ_SKIP_MANIFEST" measure-out/skip-manifest.txt
          grep -E "deep" /tmp/cargotest.log | head -5 > measure-out/deepnest-mac.log || true
          raw_passed=$(awk '/^test result:/ {for (i = 2; i <= NF; i++) if ($i == "passed;") n += $(i-1)} END {print n + 0}' /tmp/cargotest.log)
          skipped=$(grep -c . "$SPZ_SKIP_MANIFEST" || true)
          echo "::notice title=engine-tests::raw passed=$raw_passed; NOT EXERCISED=$skipped (manifest uploaded); exercised=$((raw_passed - skipped)); cargo exit=$status"
          exit "$status"
      - name: Build Swift app + sign (existing project self-signed identity only)
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          ./scripts/build-engine.sh
          swift build -c release --arch arm64 --arch x86_64
          HASH="$(./scripts/sign-setup.sh | tail -1)"
          echo "signhash=$HASH" >> "$GITHUB_ENV"
          ./scripts/package-dmg.sh "0.0.measure" "$HASH"
      - name: Stall responsiveness proxies (typing / hover / expand + main-thread sample)
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p measure-out
          # Owned-PID cleanup: TERM the exact process this step launched, grace, then KILL only that
          # PID (run 38486848714 evidence: name-based pkill + AX calls blocked past poll bounds).
          kill_owned() {
            [ -n "$1" ] || return 0
            kill -TERM "$1" 2>/dev/null || true
            for k in $(seq 1 10); do kill -0 "$1" 2>/dev/null || break; sleep 0.5; done
            kill -0 "$1" 2>/dev/null && kill -KILL "$1" 2>/dev/null || true
          }
          echo "marker ts_ms=$(($(date +%s)*1000)) stage=initial-launch"
          open -n dist/Spacelyzer.app --env SPZ_AUTOSCAN=/Library
          PID=""
          for i in $(seq 1 60); do PID=$(pgrep -x Spacelyzer | head -1); [ -n "$PID" ] && break; sleep 0.5; done
          [ -n "$PID" ] || { echo "::error::app did not launch"; exit 1; }
          echo "marker ts_ms=$(($(date +%s)*1000)) stage=initial-pid pid=$PID"
          # External wall-clock watchdog (pure bash, no coreutils dependency): runs one command,
          # TERM at the limit, KILL 15s later, passes the exit code through (124 on timeout).
          # Survives any in-process block; driver also self-limits (see stall-driver.swift header).
          run_bounded() {
            local limit=$1; shift
            local flag; flag=$(mktemp "${TMPDIR:-/tmp}/spzwatch.XXXXXX")
            "$@" & local cpid=$!
            ( i=0; while [ "$i" -lt "$limit" ]; do sleep 1; i=$((i+1)); done
              echo 1 > "$flag"
              kill -TERM "$cpid" 2>/dev/null
              i=0; while [ "$i" -lt 15 ]; do sleep 1; kill -0 "$cpid" 2>/dev/null || break; i=$((i+1)); done
              kill -KILL "$cpid" 2>/dev/null ) & local wpid=$!
            wait "$cpid"; local rc=$?
            kill "$wpid" 2>/dev/null; wait "$wpid" 2>/dev/null
            if [ -s "$flag" ]; then echo "WATCHDOG-EXTERNAL timeout_s=$limit cmd=$1"; rc=124; fi
            rm -f "$flag"
            return "$rc"
          }
          run_bounded 300 /tmp/spz-stall-driver waitwindow "$PID" || { echo "::error::no AX window"; kill_owned "$PID"; exit 1; }
          sample "$PID" 30 10 -file /tmp/spz-main-sample.txt &   # CONTEXT ONLY - not instrumentation (see header)
          SAMPLEPID=$!
          run_bounded 300 /tmp/spz-stall-driver baseline "$PID" measure-out/ax-baseline.jsonl
          run_bounded 300 /tmp/spz-stall-driver type "$PID" measure-out/ax-type.jsonl "keep-tag-0001-measurement-stall-pass" || true
          run_bounded 300 /tmp/spz-stall-driver expand "$PID" measure-out/ax-expand.jsonl || true
          run_bounded 300 /tmp/spz-stall-driver nonascii "$PID" measure-out/ax-nonascii.jsonl || true
          echo "marker ts_ms=$(($(date +%s)*1000)) stage=initial-measurements-done"
          wait "$SAMPLEPID" || true
          cp /tmp/spz-main-sample.txt measure-out/main-thread-sample.txt
          kill_owned "$PID"
      - name: Cancel/rescan cycles + post-cancel responsiveness
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p measure-out
          # Bounded scan fixture lengthens the REAL scan window so the Stop control is observable
          # (rationale + numbers in scripts/measure/make-cancel-fixture.sh). One-time generation.
          bash scripts/measure/make-cancel-fixture.sh "$RUNNER_TEMP/spz-cancel-fixture"
          FIX="$RUNNER_TEMP/spz-cancel-fixture"
          kill_owned() {
            [ -n "$1" ] || return 0
            kill -TERM "$1" 2>/dev/null || true
            for k in $(seq 1 10); do kill -0 "$1" 2>/dev/null || break; sleep 0.5; done
            kill -0 "$1" 2>/dev/null && kill -KILL "$1" 2>/dev/null || true
          }
          # External wall-clock watchdog (pure bash, no coreutils dependency): runs one command,
          # TERM at the limit, KILL 15s later, passes the exit code through (124 on timeout).
          # Survives any in-process block; driver also self-limits (see stall-driver.swift header).
          run_bounded() {
            local limit=$1; shift
            local flag; flag=$(mktemp "${TMPDIR:-/tmp}/spzwatch.XXXXXX")
            "$@" & local cpid=$!
            ( i=0; while [ "$i" -lt "$limit" ]; do sleep 1; i=$((i+1)); done
              echo 1 > "$flag"
              kill -TERM "$cpid" 2>/dev/null
              i=0; while [ "$i" -lt 15 ]; do sleep 1; kill -0 "$cpid" 2>/dev/null || break; i=$((i+1)); done
              kill -KILL "$cpid" 2>/dev/null ) & local wpid=$!
            wait "$cpid"; local rc=$?
            kill "$wpid" 2>/dev/null; wait "$wpid" 2>/dev/null
            if [ -s "$flag" ]; then echo "WATCHDOG-EXTERNAL timeout_s=$limit cmd=$1"; rc=124; fi
            rm -f "$flag"
            return "$rc"
          }
          for i in 1 2 3; do
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-launch"
            open -n dist/Spacelyzer.app --env SPZ_AUTOSCAN="$FIX"
            PID=""
            for j in $(seq 1 100); do PID=$(pgrep -x Spacelyzer | head -1); [ -n "$PID" ] && break; sleep 0.1; done
            [ -n "$PID" ] || { echo "cycle $i: no process" >> measure-out/cancel-cycles.jsonl; continue; }
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-pid pid=$PID"
            run_bounded 300 /tmp/spz-stall-driver waitwindow "$PID" || true
            # driver polls from t=0 for the actual "Stop scan" button; a missed window is an honest
            # error row, never a fabricated press
            run_bounded 300 /tmp/spz-stall-driver cancel "$PID" "measure-out/cancel-cycle-$i.jsonl" || true
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-cancel-done"
            kill_owned "$PID"
            echo "marker ts_ms=$(($(date +%s)*1000)) stage=cycle-$i-cleanup-done"
          done
      - name: Engine soak (in-process + separate-process, live-RSS timeline)
        if: ${{ !inputs.compile_only }}
        run: bash scripts/measure/soak.sh ./target/release/spz measure-out /Library
      - name: Poisoned-subtree failure recovery (engine, named failure)
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p measure-out /tmp/spz-poison/sub
          echo x > /tmp/spz-poison/sub/file.txt
          chmod 000 /tmp/spz-poison/sub
          echo "fixture: /tmp/spz-poison/sub chmod 000 - sole constructed defect" | tee measure-out/poison-fixture.txt
          echo "runner-uid=$(id -u)" | tee measure-out/poison-denial.txt
          ls /tmp/spz-poison/sub >> measure-out/poison-denial.txt 2>&1 && echo "PROBE-READABLE" >> measure-out/poison-denial.txt || echo "PROBE-DENIED" >> measure-out/poison-denial.txt
          ./target/release/spz scan /tmp/spz-poison > measure-out/poison-scan.log 2>&1 &
          SCANPID=$!
          for i in $(seq 1 60); do kill -0 "$SCANPID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$SCANPID" 2>/dev/null; then kill -9 "$SCANPID"; RC=124; else wait "$SCANPID"; RC=$?; fi
          echo "poison-scan-exit=$RC" >> measure-out/poison-scan.log
          chmod 755 /tmp/spz-poison/sub
      - name: Volume capability probe (APFS + exFAT disk images, non-UTF-8 errno, cross-device verify)
        if: ${{ !inputs.compile_only }}
        run: bash scripts/measure/volumes.sh ./target/release/spz measure-out
      - name: Cold launch x3 (informational ballpark)
        if: ${{ !inputs.compile_only }}
        run: bash scripts/measure/cold-launch.sh dist/Spacelyzer.app /tmp/spz-stall-driver measure-out
      - name: Pinned-artifact validation (same-run hash + signature evidence)
        if: ${{ !inputs.compile_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p measure-out/artifact
          HEADSHA=$(gh run view 38425289474 --json headSha --jq .headSha)
          echo "artifact run headSha=$HEADSHA" | tee measure-out/artifact/run-headsha.txt
          [ "$HEADSHA" = "00aa46a2d384ec4648ae4571ccb2eaee5a7e6324" ] || { echo "::error::artifact run head $HEADSHA != pinned 00aa46a2"; exit 1; }
          gh run download 38425289474 -n Spacelyzer-0.1.157 -D measure-out/artifact
          ls -la measure-out/artifact
          DMG=$(ls measure-out/artifact/*.dmg | head -1)
          ACTUAL=$(shasum -a 256 "$DMG" | awk '{print $1}')
          EXPECTED=$(awk '{print $1}' measure-out/artifact/*.sha256 | head -1)
          echo "actual=$ACTUAL" | tee measure-out/artifact/dmg-sha256-actual.txt
          echo "ci=$EXPECTED" | tee measure-out/artifact/dmg-sha256-ci.txt
          [ -n "$EXPECTED" ] && [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::DMG hash != CI-recorded sha256"; exit 1; }
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/spz-dmg-mnt
          codesign --verify --deep --strict /tmp/spz-dmg-mnt/Spacelyzer.app 2>&1 | tee measure-out/artifact/codesign-verify.txt || true
          codesign -dv --verbose=4 /tmp/spz-dmg-mnt/Spacelyzer.app 2>&1 | tee measure-out/artifact/codesign-identity.txt || true
          spctl -a -vv -t install /tmp/spz-dmg-mnt/Spacelyzer.app 2>&1 | tee measure-out/artifact/spctl-verdict.txt || true
          hdiutil detach /tmp/spz-dmg-mnt || true
      - name: Evaluator self-test (synthetic regression; malformed/absent evidence never PASSes)
        if: ${{ !inputs.compile_only }}
        run: python3 scripts/measure/evaluate.py --selftest
      - name: Evaluate against pre-registered bars
        if: ${{ !inputs.compile_only }}
        run: python3 scripts/measure/evaluate.py measure-out | tee measure-out/verdicts.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stall-soak-measurement
          path: measure-out/
          if-no-files-found: warn
